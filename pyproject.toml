[project]
name = "vertex-orchestrator"
version = "0.1.0"
description = "Unified orchestration of CrewAI, AutoGen, and Aider via Google Vertex AI"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
crewai = ["crewai>=0.70"]
autogen = ["pyautogen>=0.2"]
aider = ["aider-chat>=0.6"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"